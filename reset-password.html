<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your Bundle password</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="brand">BUNDLE / PASSWORD RESET</div><div class="card"><h1>Reset password.</h1><form id="form"><label>Email</label><input id="email" type="email" required><label>Reset token</label><input id="token" required><label>New password</label><input id="password" type="password" minlength="10" required><button>Reset password</button></form><div id="result" class="notice" style="display:none"></div></div><script>const qs=new URLSearchParams(location.search);email.value=qs.get('email')||'';token.value=qs.get('token')||'';const API=window.BUNDLE_API_URL||location.origin+'/api';form.addEventListener('submit',async e=>{e.preventDefault();const out=result;try{const r=await fetch(API+'/auth/password/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,token:token.value,newPassword:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Reset failed');out.style.display='block';out.className='notice success';out.textContent='Password reset complete. You can now sign in to Bundle.'}catch(err){out.style.display='block';out.className='notice danger';out.textContent=err.message}})</script></main></body></html>
